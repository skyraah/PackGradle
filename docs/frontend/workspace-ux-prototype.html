这是抛弃式原型：结论验证后请把决策折回真实代码，本文件归档到抛弃分支。

<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackGradle 工作区 UX 原型（演示数据）</title>
<style>
/* ================= 1. 主题令牌 =================
   视觉基准：docs/概念风格.pdf（2026-08-28 起，取代 PCL2/pcl2.png）。
   色值为该 PDF 逐像素采样所得：
   - 主内容区：平面底 #1B212D（取概念板渐变中位色；2026-08-28 用户反馈渐变
     视觉效果不佳，已由渐变改为平面背景）
   - 壳层（标题栏 + icon rail）：#121720，深于内容区
   - 强调色：祖母绿 #4ADE80；未激活 rail 图标为低饱和灰绿
   结构/密度/窗口规格仍遵循 05 文档 §11.2/§11.3（非视觉部分不变）。 */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface2:#EDF1F6; --surface3:#E3E9F0;
  --rail:#FFFFFF;
  --border:rgba(15,23,42,.14); --border-weak:rgba(15,23,42,.07);
  --text:#17202B; --muted:#5A6675; --faint:#8B95A3;
  --rail-icon:#5A6675;
  --primary:#16A34A; --on-primary:#FFFFFF;
  --success:#16A34A; --warning:#B45309; --error:#DC2626; --info:#0369A1;
  --tint-primary:rgba(22,163,74,.10); --tint-success:rgba(22,163,74,.10);
  --tint-warning:rgba(180,83,9,.11); --tint-error:rgba(220,38,38,.09);
  --shadow:0 10px 32px rgba(15,23,42,.16);
  --proto:#7A3FF2;
}
html[data-theme="dark"]{
  --bg:#1B212D; --surface:#222A37; --surface2:#2A3240; --surface3:#333C4C;
  --rail:#121720;
  --border:rgba(148,163,184,.14); --border-weak:rgba(148,163,184,.07);
  --text:#E9EDF3; --muted:#9AA6B6; --faint:#6C7787;
  --rail-icon:#6F8878;   /* 未激活 rail 图标：低饱和灰绿（概念板采样） */
  --primary:#4ADE80; --on-primary:#052E16;
  --success:#4ADE80; --warning:#FBBF24; --error:#F87171; --info:#7DD3FC;
  --tint-primary:rgba(74,222,128,.13); --tint-success:rgba(74,222,128,.13);
  --tint-warning:rgba(251,191,36,.13); --tint-error:rgba(248,113,113,.13);
  --shadow:0 10px 32px rgba(0,0,0,.5);
}

/* ================= 2. 基础与壳层 ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.55 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--text)}
a{color:var(--primary);text-decoration:none}
::selection{background:var(--tint-primary)}
#app{display:flex;flex-direction:column;height:100%}

/* 标题栏 44-48px（§11.2） */
.titlebar{
  height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 0;
  background:var(--rail);border-bottom:1px solid var(--border);user-select:none;
}
.tb-brand{width:68px;flex:none;display:flex;align-items:center;justify-content:center}
.tb-logo{
  width:30px;height:30px;border-radius:8px;background:var(--tint-primary);color:var(--primary);
  border:1px solid var(--tint-primary);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;
}
.tb-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tb-sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-drag{flex:1;height:100%}           /* Wails 拖拽区占位 */
.tb-actions{display:flex;align-items:center;gap:6px;padding-right:2px}
.win-btn{width:40px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:6px}
.win-btn:hover{background:var(--surface2);color:var(--text)}
.win-btn.close:hover{background:var(--error);color:#fff}

/* 左侧 icon rail 68px（§5.1） */
.body-row{flex:1;display:flex;min-height:0}
.rail{
  width:68px;flex:none;background:var(--rail);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;
}
.rail-btn{
  width:48px;height:48px;border-radius:10px;display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;color:var(--rail-icon);position:relative;
}
.rail-btn span{font-size:10px;line-height:1}
.rail-btn:hover{background:var(--surface2);color:var(--text)}
.rail-btn.active{background:var(--tint-primary);color:var(--primary)}
.rail-spacer{flex:1}

/* 主内容区：唯一纵向滚动容器；平面背景（不用渐变） */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;overflow-y:auto;padding:20px 24px 84px}
@media (max-width:1000px){.screen{padding:16px}}

/* ================= 3. 基础组件 ================= */
.icon{width:20px;height:20px;flex:none;display:inline-block;vertical-align:-4px}
.icon.sm{width:16px;height:16px;vertical-align:-3px}
.icon.lg{width:24px;height:24px}

/* 按钮：同区域最多一个高强调主操作（§8） */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;
  border:1px solid transparent;font-weight:600;font-size:12.5px;white-space:nowrap;
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-tonal{background:var(--tint-primary);color:var(--primary)}
.btn-tonal:hover{filter:brightness(1.05)}
.btn-text{color:var(--muted)}
.btn-text:hover{background:var(--surface2);color:var(--text)}
.btn-outline{border-color:var(--border);color:var(--text)}
.btn-outline:hover{background:var(--surface2)}
.btn-danger-t{background:var(--tint-error);color:var(--error)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-icon{width:34px;padding:0;justify-content:center;color:var(--muted)}
.btn-icon:hover{background:var(--surface2);color:var(--text)}
.btn-icon.danger{color:var(--error)}

/* 状态标签：只读，不使用按钮外观（§3.2） */
.st{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:4px;
  font-size:11.5px;font-weight:600;cursor:default;white-space:nowrap;
}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st.plain::before{display:none}
.st-ok{background:var(--tint-success);color:var(--success)}
.st-run{background:var(--tint-primary);color:var(--primary)}
.st-run.pulse::before{animation:pp 1.2s ease-in-out infinite}
@keyframes pp{50%{opacity:.25}}
.st-warn{background:var(--tint-warning);color:var(--warning)}
.st-err{background:var(--tint-error);color:var(--error)}
.st-mut{background:var(--surface2);color:var(--muted)}
.st-info{background:var(--tint-primary);color:var(--info)}

.chip{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:6px;
  background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:600;cursor:default;
}
.chip.proto{background:transparent;border:1px dashed var(--proto);color:var(--proto);cursor:default}
.chip.demo{background:var(--tint-warning);color:var(--warning)}

/* 状态横幅（§7.3）：只表达当前最需要处理的状态 */
.banner{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;margin-bottom:14px;
  font-size:12.5px;border:1px solid transparent;
}
.banner .grow{flex:1;min-width:0}
.banner b{font-weight:700}
.banner-warn{background:var(--tint-warning);border-color:var(--tint-warning);color:var(--text)}
.banner-warn .icon{color:var(--warning)}
.banner-err{background:var(--tint-error);border-color:var(--tint-error);color:var(--text)}
.banner-err .icon{color:var(--error)}
.banner-info{background:var(--tint-primary);border-color:var(--tint-primary);color:var(--text)}
.banner-info .icon{color:var(--primary)}
.banner-ok{background:var(--tint-success);border-color:var(--tint-success);color:var(--text)}
.banner-ok .icon{color:var(--success)}

/* 页头 / 工具栏 44-52px（§11.2） */
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.page-head h1{font-size:18px;font-weight:700;line-height:1.3}
.page-head .grow{flex:1;min-width:0}
.page-sub{color:var(--muted);font-size:12px;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 0;flex-wrap:wrap}
.toolbar .grow{flex:1}
.hint-fixed{color:var(--faint);font-size:11.5px}

.field{
  height:34px;border:1px solid var(--border);border-radius:6px;background:var(--surface);
  padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--text);
}
.field input{border:none;outline:none;background:transparent;width:170px}
.field select{border:none;outline:none;background:transparent;color:var(--text)}
.field:focus-within{border-color:var(--primary)}

/* 页签 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:8px 0 14px}
.tab{
  padding:8px 14px;font-weight:600;color:var(--muted);border-radius:6px 6px 0 0;position:relative;font-size:12.5px;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary)}
.tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}

/* 表格 48-56px 行高（§11.2） */
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.table th{
  text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:9px 12px;
  border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;
}
.table td{padding:10px 12px;border-bottom:1px solid var(--border-weak);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tbody tr:hover{background:var(--surface2)}
.table .num{font-variant-numeric:tabular-nums}
.rowname{font-weight:600}
.rowsub{color:var(--faint);font-size:11.5px;margin-top:1px}
.ellipsis{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px}
.table-scroll{overflow-x:auto}   /* 表格只在自身容器横向滚动（§11.3） */

/* 骨架：同构行骨架，不用 spinner（§7.1/§9） */
.skel{border-radius:6px;background:var(--surface2);animation:sk 1.1s ease-in-out infinite}
@keyframes sk{50%{opacity:.45}}

/* 空态 */
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty .icon{width:40px;height:40px;color:var(--faint);margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text);margin-bottom:4px}
.empty p{font-size:12px;margin-bottom:16px}

/* 区块标题 */
.sec{font-size:13px;font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:0}
.sec .n{color:var(--faint);font-weight:600;font-size:12px}

/* 原型注记：与产品 UI 明确区分 */
.pnote{
  border:1px dashed var(--proto);border-radius:8px;padding:8px 12px;margin:12px 0;
  color:var(--proto);font-size:11.5px;display:flex;gap:8px;align-items:flex-start;
}
.pnote b{flex:none}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.tech{color:var(--faint);font-size:11px;word-break:break-all}

/* ================= 4. 抽屉 / 弹窗 / 菜单 / 提示 ================= */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,calc(100vw - 68px));z-index:50;
  background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;
  box-shadow:var(--shadow);
}
.drawer-h{flex:none;display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700}
.drawer-b{flex:1;overflow-y:auto;padding:14px 16px}
.drawer-f{flex:none;padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

.dialog-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.42)}
.dialog{
  width:min(520px,calc(100vw - 48px));max-height:min(640px,calc(100vh - 64px));
  background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;
}
.dialog-h{flex:none;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px}
.dialog-b{flex:1;overflow-y:auto;padding:16px 18px}
.dialog-f{flex:none;padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.danger-strip{border-left:3px solid var(--error)}

.menu{
  position:fixed;z-index:55;min-width:190px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;box-shadow:var(--shadow);padding:5px;
}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;text-align:left;color:var(--text)}
.menu button:hover{background:var(--surface2)}
.menu button.danger{color:var(--error)}
.menu .msep{height:1px;background:var(--border-weak);margin:5px 4px}

#toast-root{position:fixed;right:18px;bottom:76px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{
  background:var(--surface3);color:var(--text);border:1px solid var(--border);border-radius:8px;
  padding:9px 14px;font-size:12.5px;box-shadow:var(--shadow);max-width:380px;
}
.toast.ok{border-left:3px solid var(--success)}
.toast.err{border-left:3px solid var(--error)}

/* ================= 5. 画板导航浮条（原型专用，非产品 UI） ================= */
.proto-bar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:45;
  display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:999px;
  background:#141519;color:#EDEEF2;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:12px;max-width:min(94vw,980px);white-space:nowrap;
}
.proto-bar .pb-dot{width:8px;height:8px;border-radius:50%;background:var(--proto);margin:0 4px;flex:none}
.proto-bar button{color:#EDEEF2;border-radius:999px;white-space:nowrap}
.pb-nav{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.pb-nav:hover{background:rgba(255,255,255,.12)}
.pb-label{padding:0 8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-label small{color:#9DA2AB;font-weight:500;margin-right:6px}
.pb-extra{display:flex;align-items:center;gap:4px;border-left:1px solid rgba(255,255,255,.14);padding-left:8px;margin-left:4px}
.pb-extra select{background:transparent;color:#EDEEF2;border:none;font-size:11.5px;outline:none}
.pb-extra select option{color:#111}
.pb-mini{height:28px;padding:0 10px;font-size:11.5px;color:#C9CAD1}
.pb-mini:hover{background:rgba(255,255,255,.12);color:#fff}

/* ================= 6. 画板：工作区列表 ================= */
.ws-id{display:flex;align-items:center;gap:8px;min-width:240px}
.ws-id .pair{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ws-id .icon{color:var(--faint)}
.task-cell{display:flex;align-items:center;gap:8px;min-width:150px}
.prog{width:90px;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--primary);border-radius:3px}
.rowlink{cursor:pointer}
tr.stale-row td{opacity:.78}

/* 演示控制条（列表画板） */
.demo-strip{display:flex;gap:8px;align-items:center;margin-bottom:12px;padding:8px 12px;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.demo-strip select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;height:26px;padding:0 6px}

/* ================= 7. 画板：向导 ================= */
.wiz{display:grid;grid-template-columns:210px 1fr;gap:22px;min-height:60%}
@media (max-width:900px){.wiz{grid-template-columns:1fr}}
.wiz-steps{border-right:1px solid var(--border);padding-right:18px}
@media (max-width:900px){.wiz-steps{border-right:none;border-bottom:1px solid var(--border);padding:0 0 12px;display:flex;gap:6px}}
.wstep{display:flex;gap:10px;padding:9px 8px;border-radius:8px;color:var(--muted);align-items:flex-start}
@media (max-width:900px){.wstep{padding:6px 8px}}
.wstep .n{
  width:22px;height:22px;border-radius:50%;background:var(--surface2);color:var(--muted);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;margin-top:1px;
}
.wstep.cur{color:var(--text);font-weight:600;background:var(--surface2)}
.wstep.cur .n{background:var(--primary);color:var(--on-primary)}
.wstep.done .n{background:var(--tint-success);color:var(--success)}
.cand{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);
  border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--surface);
}
.cand:hover{background:var(--surface2)}
.cand.sel{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.cand.dis{opacity:.55;cursor:not-allowed}
.cand .grow{flex:1;min-width:0}
.radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);flex:none}
.cand.sel .radio{border-color:var(--primary);box-shadow:inset 0 0 0 3px var(--surface)}
.cand.sel .radio{background:var(--primary)}

/* 创建进度（N-05） */
.psteps{max-width:460px;margin:8px 0 18px}
.pstep{display:flex;align-items:center;gap:12px;padding:10px 4px;color:var(--muted)}
.pstep .ic{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted)}
.pstep.done{color:var(--text)}
.pstep.done .ic{background:var(--tint-success);color:var(--success)}
.pstep.run{color:var(--text)}
.pstep.run .ic{background:var(--tint-primary);color:var(--primary)}
.pstep.run .icon{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= 8. 画板：变化页 ================= */
.metrics{
  display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;
  padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;
}
.metrics b{color:var(--text);font-weight:600}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{
  height:26px;padding:0 11px;border-radius:999px;border:1px solid var(--border);
  color:var(--muted);font-size:11.5px;font-weight:600;background:var(--surface);
}
.fchip:hover{color:var(--text)}
.fchip.on{background:var(--tint-primary);border-color:transparent;color:var(--primary)}
.verdict{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px;cursor:default}
.v-p{color:var(--primary)} .v-r{color:var(--info)} .v-c{color:var(--warning)} .v-d{color:var(--error)} .v-s{color:var(--muted)} .v-l{color:var(--warning)}
.ev3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:1100px){.ev3{grid-template-columns:1fr}}
.evcol{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg)}
.evcol h4{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}

/* ================= 9. 画板：计划页 ================= */
.sumchips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.sumchips .chip b{color:var(--text);margin-left:4px}
.chip.hot{background:var(--tint-warning);color:var(--warning)}
.chip.bad{background:var(--tint-error);color:var(--error)}
.op-conflict{background:var(--tint-warning)}

/* ================= 10. 画板：重绑定 ================= */
.rebind-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.rebind-grid{grid-template-columns:1fr}}
.panel{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:14px 16px}
.panel h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.preflight{margin-top:16px}
.pf-row{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border-weak);font-size:12.5px}
.pf-row:last-child{border-bottom:none}
.pf-row .icon{margin-top:1px}
.pf-ok{color:var(--success)} .pf-warn{color:var(--warning)} .pf-err{color:var(--error)}

/* ================= 11. 画板：设置（全宽分区，不用嵌套卡片 §7.11） ================= */
.set-sec{border-top:1px solid var(--border);padding:18px 0 6px}
.set-sec:first-of-type{border-top:none;padding-top:4px}
.set-sec h2{font-size:14.5px;margin-bottom:2px}
.set-sec .desc{color:var(--muted);font-size:12px;margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:14px;padding:9px 0;flex-wrap:wrap}
.set-row .lab{width:150px;flex:none;color:var(--muted);font-size:12.5px}
.set-row .val{flex:1;min-width:200px}
.set-row .ops{display:flex;gap:8px}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
</style>

function filterChips(){
  const chips = ['全部','有变化','有冲突','Project 已改','Runtime 已改','含删除'];

function resourcesFiltered(){
  const f = S.changes.filter, q = S.changes.search.trim(), t = S.changes.type;
  const hasDel = r => /删除/.test(r.p) || /删除/.test(r.r);
  return DEMO.resources.filter(r => {
    if (t !== '全部' && r.t !== t) return false;
    if (q && !(r.n + r.sub).toLowerCase().includes(q.toLowerCase())) return false;
    if (f === '有变化')      return ['p','r','c','dc','l','rd'].includes(r.v);
    if (f === '有冲突')      return ['c','dc'].includes(r.v);
    if (f === 'Project 已改') return ['p','c','dc'].includes(r.v) || r.v === 'rd';
    if (f === 'Runtime 已改') return ['r','c','dc'].includes(r.v);
    if (f === '含删除')       return hasDel(r) || r.v === 'dc';
    return true;
  });
}

function navigate(hash){ if (location.hash === hash) render(); else location.hash = hash; }
function parseRoute(){
  const h = location.hash || '#/workspaces';
  let m;
  if (h === '#/workspaces')              return { page:'ws-list' };
  if (h === '#/workspaces/new')          return { page:'wizard' };
  if ((m = h.match(/^#\/workspaces\/([\w-]+)\/changes$/)))  return { page:'changes', ws:m[1] };
  if ((m = h.match(/^#\/workspaces\/([\w-]+)\/mappings$/))) return { page:'mappings', ws:m[1] };
  if ((m = h.match(/^#\/workspaces\/([\w-]+)\/rebind$/)))   return { page:'rebind', ws:m[1] };
  if ((m = h.match(/^#\/workspaces\/([\w-]+)\/plans\/(\w+)$/))) return { page:'plan', ws:m[1], kind:m[2] };
  if (h === '#/sources')                 return { page:'sources' };
  if (h === '#/runtimes')                return { page:'runtimes' };
  if (h === '#/settings')                return { page:'settings' };
  return { page:'ws-list' };
}

  /* ---- 变化页 C-01..C-06 ---- */
  'changes'(rt){
    const w = wsOf(rt.ws); S.ws = rt.ws;
    let head = wsObjHead(w), body = '';
    const planBtn = `<button class="btn btn-primary" data-action="changes-plan" data-kind="sync">生成同步分析</button>`;
    const prio = [ // §7.3 横幅优先级（只表达当前最需要处理的状态）
      w.health==='recovery_required', w.health==='rebind_required', false, w.scan==='failed',
      w.scan==='scanning', S.staleDemo, false, w.diff==='conflicted', w.diff==='dirty', w.diff==='clean',
    ];
    if (prio[0]) body += banner('err','errC',`<b>需要恢复</b> · 上次执行同步未完成验证，已阻止新的执行与恢复。历史与诊断保留可查。`,
      `<button class="btn btn-danger-t btn-sm" data-action="task-recover">处理恢复</button>`);
    else if (prio[1]) body += banner('warn','linkOff',`<b>需要重新绑定</b> · 扫描发现绑定证据与登记指纹不符，当前端点身份无法确认。`,
      `<button class="btn btn-tonal btn-sm" data-action="open-rebind" data-ws="${w.id}">重新绑定</button>`);
    else if (prio[3]) body += banner('err','errC',`<b>扫描失败</b> · 读取端点失败：路径不可访问（演示错误）。`,
      `<button class="btn btn-tonal btn-sm" data-action="changes-scan" data-ws="${w.id}">重试扫描</button>`);
    else if (prio[2] === false && w.scan === 'never') {
      body = `<div class="empty">${I('scan','lg')}<h3>未扫描</h3><p>扫描为只读操作，用于建立三方（Project / Baseline / Runtime）状态。</p>
        <button class="btn btn-primary" data-action="changes-scan" data-ws="${w.id}">${I('play','sm')} 开始扫描</button></div>`;
      return { title:`变化 · ${w.p} ↔ ${w.r}`, sub:'工作区是唯一跨端操作入口', html: head + body };
    }
    else if (prio[4]) body += banner('info','sync',`<b>扫描中</b> · ${esc(w.task ? w.task.phase : '')}，旧数据保留展示，事件不直接替换资源表。`,
      `<button class="btn btn-tonal btn-sm" data-action="open-tasks">查看任务</button>`);
    else if (prio[5]) body += banner('warn','clock',`<b>当前结果已标记为过期</b> · 检测到端点可能发生变化，请重新扫描后再生成分析。`,
      `<button class="btn btn-tonal btn-sm" data-action="changes-scan" data-ws="${w.id}">重新扫描</button>`);
    else if (prio[7]) body += banner('warn','warn',`<b>存在冲突</b> · 2 项资源在两侧均被修改，需要在计划中以冲突决议处理（Phase 2 提供）。`,
      planBtn);
    else if (prio[8]) body += banner('info','sync',`<b>有待同步变化</b> · 可生成同步分析查看影响。`, planBtn);
    else if (prio[9]) body += banner('ok','check',`<b>无待同步变化</b> · 工作区处于 clean 状态。`, '');
    else body += banner('info','sync',`<b>可生成同步分析</b>`, planBtn);

    if (w.scan === 'scanning') { // §9 状态矩阵：扫描中保留对象头与工具栏，表格给同构骨架
      body += `<div class="table-scroll"><table class="table">
        <thead><tr><th>资源</th><th>Project</th><th>Baseline</th><th>Runtime</th><th>判断</th><th></th></tr></thead>
        <tbody>${Array.from({length:6}, () => `<tr>${Array.from({length:6}, () => `<td><div class="skel" style="height:16px;width:${50+Math.floor(Math.random()*90)}px"></div></td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
    }
    if (w.scan === 'ready' || w.scan === 'failed') {
      body += wsMetrics(w);
      if (w.scan === 'ready') {
        body += `<div class="toolbar">
          <div class="filters">${filterChips()}</div>
          <div class="grow"></div>
          <label class="field">${I('search','sm')}<input id="chg-search" placeholder="搜索资源" value="${esc(S.changes.search)}" style="width:170px"></label>
          <label class="field"><select data-bind="chg-type"><option value="全部">资源类型：全部</option>
            <option value="mod" ${S.changes.type==='mod'?'selected':''}>mod</option>
            <option value="config" ${S.changes.type==='config'?'selected':''}>config</option>
            <option value="kubejs" ${S.changes.type==='kubejs'?'selected':''}>kubejs</option>
            <option value="script" ${S.changes.type==='script'?'selected':''}>script</option>
            <option value="diag" ${S.changes.type==='diag'?'selected':''}>仅诊断</option></select></label>
        </div>
        <div class="hint-fixed" style="margin-bottom:8px">计划会分析当前策略下的全部受管资源，不受表格筛选影响。</div>
        <div class="table-scroll"><table class="table">
          <thead><tr><th>资源</th><th>Project</th><th>Baseline</th><th>Runtime</th><th>判断</th><th style="text-align:right">行末</th></tr></thead>
          <tbody id="res-tbody">${resTbody()}</tbody></table></div>
        <div class="rowsub" style="margin-top:8px">匹配 <span id="res-count">${resourcesFiltered().length}</span> / ${DEMO.resources.length} 条（演示仅列样例，实际为 2,986 项）</div>`;
      }
    }
    return {
      title:`变化 · ${w.p} ↔ ${w.r}`, sub:'理解三方状态和诊断，生成覆盖全部受管范围的分析',
      html: head + body + `<div class="pnote">${I('info','sm')}<div><b>原型注记</b> · 横幅优先级 recovery &gt; rebind &gt; 扫描失败 &gt; 扫描中 &gt; 过期 &gt; 冲突 &gt; 有变化 &gt; clean（05 文档 §7.3）。C-05「已过期」可用浮条画板切换体验；冲突决议（P-03/P-04）属 Round 2。</div></div>`,
    };
  },

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind||'');
  t.textContent = msg;
  $('toast-root').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function closeLayers(){ S.dialog=null; S.menu=null; if(S.tasksOpen){S.tasksOpen=false;} S.evidence=null; S.sideDrawer=null; renderLayers(); }
function openDialog(html){ S.dialog = html; renderLayers(); }
function confirmDialog(o){ // 确认四要素：动作+对象+后果+可逆性（05 文档 A2 原则）
  openDialog(`<div class="dialog ${o.danger?'danger-strip':''}">
    <div class="dialog-h">${I(o.danger?'warn':'help','sm')} ${esc(o.title)}</div>
    <div class="dialog-b"><div style="margin-bottom:10px">${o.body}</div>
      ${o.cons&&o.cons.length?`<div class="sec" style="margin-top:0">后果</div>`+o.cons.map(c=>`<div class="pf-row"><span class="pf-warn">${I('warn','sm')}</span><span>${c}</span></div>`).join(''):''}</div>
    <div class="dialog-f"><button class="btn btn-text" data-action="dialog-close">取消</button>
      <button class="btn ${o.danger?'btn-danger-t':'btn-primary'}" data-action="${o.act}" ${o.data||''}>${esc(o.okLabel||'确认')}</button></div>
  </div>`);
}
function simulateScan(wsId){
  const w = wsOf(wsId);
  w.scan = 'scanning'; w.task = { type:'扫描', phase:'扫描 Project 资源', progress:5 };
  DEMO.tasks.unshift({ id:'t'+Date.now(), ws:`${w.p} ↔ ${w.r}`, type:'扫描', status:'running', phase:'扫描 Project 资源', progress:5, canCancel:true, time:'刚刚' });
  S.unread++; render();
  setTimeout(() => { w.scan='ready'; w.baseline = w.baseline==='none'?'ready':w.baseline; w.diff = w.diff==='conflicted'?'conflicted':'dirty'; w.task=null; w.last='刚刚';
    const t = DEMO.tasks.find(x => x.ws === `${w.p} ↔ ${w.r}` && x.status==='running');
    if (t){ t.status='success'; t.phase='扫描完成'; t.progress=100; t.canCancel=false; }
    if ((parseRoute().page==='changes' && parseRoute().ws===wsId) || parseRoute().page==='ws-list') render();
  }, 4000);
}
function startCreating(){
  const W = S.wizard; if (!W) resetWizard();
  W.creating = true; W.done = false;
  setTimeout(() => { if (S.wizard && S.wizard.creating && !S.wizard.done){ S.wizard.done = true; render(); } }, 5000);
  if (!DEMO.tasks.some(t => t.type==='扫描' && t.ws.includes('QA'))) {
    DEMO.tasks.unshift({ id:'t-new', ws:'Collapse Pack ↔ QA Runtime', type:'扫描', status:'running', phase:'扫描项目源与运行实例', progress:10, canCancel:true, time:'刚刚' });
    S.unread++;
  }
}

        <button class="btn btn-icon btn-sm" data-action="close-tasks">${I('close','sm')}</button></div>
      <div class="drawer-b">
        <div class="rowsub" style="margin-bottom:10px">正在恢复任务状态…随后以 ListTasks / GetTask 查询结果为准（演示固定显示）。</div>
        ${DEMO.tasks.map(t => `<div class="panel" style="margin-bottom:10px;padding:12px 14px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="st st-${ST.task[t.status][1]}${t.status==='running'?' pulse':''}">${I(taskIcon(t.status),'sm')} ${ST.task[t.status][0]}</span>
            <b style="flex:1;min-width:0" class="ellipsis">${esc(t.type)} · ${esc(t.ws)}</b>
            <span class="rowsub num">${esc(t.time)}</span></div>
          <div class="rowsub" style="margin:6px 0 4px">${esc(t.phase)}</div>
          ${t.status==='running'?`<div class="task-cell" style="margin-bottom:6px"><div class="prog" style="flex:1"><i style="width:${t.progress}%"></i></div><span class="num rowsub">${t.progress}%</span></div>`:''}
          <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
            ${t.canCancel?`<button class="btn btn-text btn-sm" data-action="cancel-task" data-id="${t.id}">取消任务</button>`:''}
            ${t.ws!=='—'?`<button class="btn btn-tonal btn-sm" data-action="task-view-ws">查看工作区</button>`:''}
            ${t.status==='recovery'?`<button class="btn btn-danger-t btn-sm" data-action="task-recover">处理恢复</button>`:''}
          </div></div>`).join('')}
        <div class="pnote">${I('info','sm')}<div><b>原型注记</b> · 任务中心抽屉宽度 min(400px, viewport−rail)；取消仅在 can_cancel=true 时显示（§5.3）。</div></div>
      </div></aside>`;
  }
  if (S.evidence){
    const r = S.evidence;
    html += `<div class="overlay" data-action="close-evidence"></div><aside class="drawer" style="width:min(460px,calc(100vw - 68px))">
      <div class="drawer-h">${I('file','sm')} <span class="mono ellipsis">${esc(r.n)}</span><div style="flex:1"></div>
        ${(() => { const [vl,vc] = verdictLabel(r.v); return `<span class="st plain st-${vc==='v-s'?'mut':'warn'}">${esc(vl)}</span>`; })()}
        <button class="btn btn-icon btn-sm" data-action="close-evidence">${I('close','sm')}</button></div>
      <div class="drawer-b">
        <div class="ev3">
          <div class="evcol"><h4>${I('folder','sm')} Project</h4><div class="kv" style="grid-template-columns:64px 1fr">
            <dt>状态</dt><dd>${esc(r.p)}</dd><dt>路径</dt><dd class="mono tech">${esc(r.n)}</dd><dt>变化原因</dt><dd>${r.v==='c'?'两侧均有本地修改（演示）':r.v.startsWith('r')?'Runtime 侧修改':'Project 侧修改'}</dd></div></div>
          <div class="evcol"><h4>${I('clock','sm')} Baseline</h4><div class="kv" style="grid-template-columns:64px 1fr">
            <dt>状态</dt><dd>${esc(r.b)}</dd><dt>含义</dt><dd>上次认可状态</dd></div></div>
          <div class="evcol"><h4>${I('cube','sm')} Runtime</h4><div class="kv" style="grid-template-columns:64px 1fr">
            <dt>状态</dt><dd>${esc(r.r)}</dd><dt>路径</dt><dd class="mono tech">${esc(r.n)}</dd></div></div>
        </div>
        <div class="sec">命中的 MappingRule</div>
        <div class="rowsub mono">${r.t==='mod'?'mods/**（双向 · 复制）':r.t==='kubejs'?'kubejs/**（双向 · 复制）':'config/**（双向 · 复制）'}</div>
        <div class="sec">技术信息</div>
        <div class="tech mono">resource_id: res_${r.n.length}8f · snapshot: snap_14h20m · hash: blake2s: ${r.n.length}e2…7a<br>detail:（原始诊断 detail 仅出现在此处，普通视图不暴露）</div>
      </div>
      <div class="drawer-f"><button class="btn btn-outline btn-sm" data-action="copy-text">${I('copy','sm')} 复制诊断</button>
        <button class="btn btn-primary btn-sm" data-action="close-evidence">关闭</button></div>
    </aside>`;
  }
  if (S.sideDrawer){
    html += `<div class="overlay" data-action="close-side"></div><aside class="drawer">
      <div class="drawer-h">${I('info','sm')} ${esc(S.sideDrawer.title)}<div style="flex:1"></div>
        <button class="btn btn-icon btn-sm" data-action="close-side">${I('close','sm')}</button></div>
      <div class="drawer-b">${S.sideDrawer.html}</div>
      <div class="drawer-f"><button class="btn btn-primary btn-sm" data-action="close-side">关闭</button></div>
    </aside>`;
  }
  if (S.menu){
    html += `<div class="overlay" style="background:transparent" data-action="menu-close"></div>
    <div class="menu" style="left:${S.menu.x}px;top:${S.menu.y}px">
      ${S.menu.items.map(m => `<button data-action="menu-run" data-code="${esc(m.act)}">${I(m.icon,'sm')} ${esc(m.label)}</button>`).join('')}
    </div>`;
  }
  root.innerHTML = html;
  const badge = $('bell-badge');
  badge.style.display = S.unread > 0 ? 'flex' : 'none';
  badge.textContent = S.unread;
  const jump = $('pb-jump');
  if (jump.options.length !== BOARDS.length){
    jump.innerHTML = BOARDS.map((b,i) => `<option value="${i}">${b.id} · ${b.t}</option>`).join('');
  }
  jump.value = boardIdx;
  $('pb-label').innerHTML = `<small>画板</small>${BOARDS[boardIdx].id} · ${BOARDS[boardIdx].t}`;
}

/* ================= 10. 主渲染 ================= */
function render(){
  const rt = parseRoute();
  const fn = SCREENS[rt.page] || SCREENS['ws-list'];
  const out = fn(rt);
  $('tb-title').textContent = out.title;
  $('tb-sub').textContent = out.sub || '';
  $('screen').innerHTML = out.html;
  document.querySelectorAll('.rail-btn').forEach(b => {
    const sec = b.dataset.sec;
    b.classList.toggle('active', sec === ({'ws-list':'workspaces',wizard:'workspaces',changes:'workspaces',mappings:'workspaces',plan:'workspaces',rebind:'workspaces'})[rt.page]);
  });
  // 画板序号只在「导航目标 ≠ 当前画板路由」时按路由回写，避免同路由画板（如 C-04/C-05）互相覆盖
  if (location.hash !== BOARDS[boardIdx].r){
    const bi = BOARDS.findIndex(b => b.r === location.hash);
    if (bi >= 0) boardIdx = bi;
  }
  renderLayers();
}

/* ================= 11. 事件 ================= */
document.addEventListener('click', (e) => {
  if (e.target.dataset && e.target.dataset.action === 'dialog-backdrop'){ S.dialog=null; renderLayers(); return; } // 点击遮罩空白处关闭
  const el = e.target.closest('[data-action],[data-nav]');
  if (!el) return;
  if (el.dataset.nav){ navigate(el.dataset.nav); return; }
  const fn = ACTIONS[el.dataset.action];
  if (fn){ fn(el.dataset, el); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'chg-search'){
    S.changes.search = e.target.value;
    const tb = $('res-tbody'), ct = $('res-count');
    if (tb) tb.innerHTML = resTbody();
    if (ct) ct.textContent = resourcesFiltered().length;
  }
});
document.addEventListener('change', (e) => {
  const bind = e.target.dataset.bind;
  if (bind === 'listMode'){ S.listMode = e.target.value; if (parseRoute().page === 'ws-list') render(); else navigate('#/workspaces'); }
  if (bind === 'chg-type'){ S.changes.type = e.target.value; render(); }
  if (e.target.id === 'pb-jump'){ switchBoard(Number(e.target.value)); }
});
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (document.activeElement && document.activeElement.isContentEditable)) return;
  if (e.key === 'Escape'){ if (S.dialog){S.dialog=null;renderLayers();} else if (S.menu){S.menu=null;renderLayers();} else if (S.tasksOpen){S.tasksOpen=false;render();} else if (S.evidence){S.evidence=null;renderLayers();} else if (S.sideDrawer){S.sideDrawer=null;renderLayers();} return; }
  if (e.key === 'ArrowLeft'){ ACTIONS['board-prev'](); }
  if (e.key === 'ArrowRight'){ ACTIONS['board-next'](); }
});
window.addEventListener('hashchange', render);

/* 扫描任务的模拟推进：仅演示，让进度条活起来 */
setInterval(() => {
  let changed = false;
  DEMO.tasks.forEach(t => {
    if (t.status === 'running' && t.progress < 100){
      t.progress = Math.min(100, t.progress + 3);
      if (t.progress >= 100){ t.status = 'success'; t.phase = '扫描完成'; t.canCancel = false; changed = true; }
    }
  });
  DEMO.workspaces.forEach(w => {
    if (w.task && w.task.progress < 100){ w.task.progress = Math.min(100, w.task.progress + 3); if (w.task.progress >= 100){ w.scan='ready'; w.diff='dirty'; w.task=null; w.last='刚刚'; changed = true; } }
  });
  // 任务抽屉打开时让进度条走起来；有完成事件时刷新列表/变化页（不重建对话框，避免丢输入）
  if (changed) render();
  else if (S.tasksOpen && !S.dialog && !S.menu) renderLayers();
}, 1200);

/* ================= 12. 启动 ================= */
$('theme-btn').innerHTML = I('sun');
if (!location.hash) location.hash = '#/workspaces';
switchBoard(0);
</script>
</body>
</html>
