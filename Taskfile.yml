version: '3'

vars:
  APP_NAME: "packgradle"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: 'yarn'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  # 验收 L0 命令集（docs/acceptance/p1-acceptance-spec.md §1.1）
  test:
    summary: Runs the full Go test suite (acceptance L0)
    cmds:
      - go test ./...

  test:vet:
    summary: Runs go vet over the whole module (acceptance L0)
    cmds:
      - go vet ./...

  test:race:
    summary: Runs the full Go test suite with -race (acceptance L0 hard gate; needs mingw-w64 gcc for CGO)
    cmds:
      - go test -race ./...

  # A 口径 headless 链路验收（验收规格 §1.1；票 #25/#40）：小规模确定性
  # fixture + 全新用户数据目录跑 Register → Scan → Snapshot → PrepareSync
  # → ResolvePlan → GetPlan 全链路（-resolve，P1 链路回归不回退）；
  # -apply 扩展（票 #40）：ConfirmPlan → Apply 跑完 → 断言 GetApplyRun
  # committed、ListCommits 含新记录、计划投影 applied、收口后 diff 归零。
  # 同一数据目录两遍 -apply：第一遍 initialize 全量收口 committed，第二遍
  # 复用 Relation 重扫重 apply（noop 收口且数据不变）。任一步失败退出码非 0。
  # -restore 扩展（票 #60；验收规格 §3）：独立 fixture（-plain-mods 无 CF
  # 声明 mod 变体）+ 独立数据目录跑回滚六场景断言链（exact 经 CAS 逐字节
  # 复验与历史不改写 / 补全就绪面 CAS miss→staged / 重做语义 / metafile 捕获
  # 回滚（票 #88：ADR-0012 出口①——捕获入 CAS、write_project 侧 CAS 命中
  # 零网络零介入收口、baseline_content 引用跨提交去重）/ partial+dirty 红线④ /
  # 存量降级 skip 链（票 #95：ADR-0012 出口③——造数手术置空 content 指针、
  # 降标 no_project_content、exact 如实拒绝、补全拒收、partial dirty））。
  # -restore 场景⑤的探测端点由 pgheadless 自动拉起假 CDN 进程（需 pgfixture.exe）。
  acceptance:headless:
    summary: Runs the pgheadless chain on a fresh data dir - a -resolve regression pass, then -apply twice on the same data dir (initialize committed + noop re-apply), then -restore six-scenario chain on a second fixture (acceptance L0)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - go build -o bin/pgfixture.exe ./cmd/pgfixture
      - rm -rf build/headless/fixture
      - go run ./cmd/pgfixture -out build/headless/fixture -mods 6 -text-files 12
      - rm -rf build/headless/data
      - bin/pgheadless.exe -project build/headless/fixture/project -instance build/headless/fixture/instance -data build/headless/data -resolve
      - bin/pgheadless.exe -project build/headless/fixture/project -instance build/headless/fixture/instance -data build/headless/data -resolve
      - bin/pgheadless.exe -project build/headless/fixture/project -instance build/headless/fixture/instance -data build/headless/data -apply
      - bin/pgheadless.exe -project build/headless/fixture/project -instance build/headless/fixture/instance -data build/headless/data -apply
      - rm -rf build/headless/fixture-restore
      - go run ./cmd/pgfixture -out build/headless/fixture-restore -mods 6 -text-files 12 -plain-mods 2
      - rm -rf build/headless/data-restore
      - bin/pgheadless.exe -project build/headless/fixture-restore/project -instance build/headless/fixture-restore/instance -data build/headless/data-restore -restore

  # 合并执行面验收链（验收规格 §3.2 场景 1/2/3；票 #93）：含手工样本夹具
  # （pgfixture 双侧样本落位）→ pgheadless -merge 三场景断言链——①初次同步后
  # 双改注入：merged_clean_count/write_merged 操作面断言 + take_merged 误用
  # resolution_invalid + resolve take_merged → confirm → committed → 双端落盘
  # 字节=确定性重算产物（merge.Texts 同算法复算）、未冲突区域字节级不变
  # （红线③）、产物与 mod metafile 入 CAS（红线②）；②先回初次提交再回合并
  # 提交：merged 行 restorable_from_cas → committed（链内零 CDN 配置，committed
  # 即零网络零用户介入证据）；③授权开态 QuickUpdate 免确认直达 committed +
  # 含冲突差异永不自动停 awaiting_confirmation（红线①）。-metrics 记 merge
  # 分相（diff3/校验/写盘，只记录不设门槛）并归档 p4-merge 记录。任一断言
  # 失败非零退出。
  acceptance:merge:
    summary: Runs the pgheadless -merge three-scenario chain (merged_clean full chain with byte/CAS assertions, zero-network rollback via restorable_from_cas, authorized-mode quick update with conflict red line) and archives merge-phase metrics (acceptance L0)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - go build -o bin/pgfixture.exe ./cmd/pgfixture
      - rm -rf build/merge
      - go run ./cmd/pgfixture -out build/merge/fixture -mods 6 -text-files 12
      - rm -rf build/merge/data
      - bin/pgheadless.exe -project build/merge/fixture/project -instance build/merge/fixture/instance -data build/merge/data -merge -metrics build/merge/metrics-merge.json
      - cp build/merge/metrics-merge.json docs/acceptance/records/p4-merge-$(date +%F)-$(hostname)-t01.json

  # 性能基线（验收规格 §2 沿用 + P2 §3 + P3 §7 新增；票 #24/#46/#66）：3,000
  # 资源确定性 fixture（产物入 build/perf，不入 git）→ 冷扫描（全新数据目录）
  # → 热扫描（同目录紧接二次）→ -apply 度量（initialize 全量 copy 即冷 apply，
  # -metrics 记分相计时 + 峰值内存增量）→ -restore-cold 度量（票 #66：漂移删
  # 全部受管文本 → restore initialize 提交 → committed exact；-metrics 记
  # restore 分相计时 prepare/staging/applying/verifying + 峰值内存采样，
  # staging 下载相位无 redownload 行如实记 0——download 只记录不设门槛）→
  # -commits 25 造 >20 提交历史 → -gc 度量（CLI 通道全墙钟 + 墓碑/对账断言，
  # GC ≤30s 新门槛）→ 门槛评估（冷 ≤10s / 热 ≤2s / 热命中率 ≥95% / 冷 apply
  # ≤30s / Apply 内存 <256MiB / restore 冷 ≤30s / restore 内存 <256MiB /
  # GC ≤30s，任一超标退出码 1）→ 达标后归档 p3-perf 记录。
  # fixture 重建前 rm -rf（T07 acceptance:headless 先例）：apply 会把 copy 落盘
  # 改写 fixture 运行时侧，不重建则重跑冷扫描/冷 apply 变 adopt_equal 收敛态。
  acceptance:perf:
    summary: Generates the 3,000-resource fixture and runs pgheadless cold/warm scans + apply + restore-cold + gc with -metrics, then evaluates the eight perf gates (acceptance L0)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - go build -o bin/pgfixture.exe ./cmd/pgfixture
      - rm -rf build/perf
      - go run ./cmd/pgfixture -out build/perf/fixture
      - rm -rf build/perf/data
      - bin/pgheadless.exe -project build/perf/fixture/project -instance build/perf/fixture/instance -data build/perf/data -metrics build/perf/metrics-cold.json
      - bin/pgheadless.exe -project build/perf/fixture/project -instance build/perf/fixture/instance -data build/perf/data -metrics build/perf/metrics-warm.json
      - bin/pgheadless.exe -project build/perf/fixture/project -instance build/perf/fixture/instance -data build/perf/data -apply -metrics build/perf/metrics-apply.json
      - bin/pgheadless.exe -project build/perf/fixture/project -instance build/perf/fixture/instance -data build/perf/data -restore-cold -metrics build/perf/metrics-restore.json
      - bin/pgheadless.exe -project build/perf/fixture/project -instance build/perf/fixture/instance -data build/perf/data -commits 25
      - bin/pgheadless.exe -project build/perf/fixture/project -instance build/perf/fixture/instance -data build/perf/data -gc -metrics build/perf/metrics-gc.json
      - cp build/perf/metrics-cold.json docs/acceptance/records/p3-perf-$(date +%F)-$(hostname)-cold.json
      - cp build/perf/metrics-warm.json docs/acceptance/records/p3-perf-$(date +%F)-$(hostname)-warm.json
      - cp build/perf/metrics-apply.json docs/acceptance/records/p3-perf-$(date +%F)-$(hostname)-apply.json
      - cp build/perf/metrics-restore.json docs/acceptance/records/p3-perf-$(date +%F)-$(hostname)-restore.json
      - cp build/perf/metrics-gc.json docs/acceptance/records/p3-perf-$(date +%F)-$(hostname)-gc.json
      - go run ./cmd/pgfixture -eval build/perf/metrics-cold.json,build/perf/metrics-warm.json,build/perf/metrics-apply.json,build/perf/metrics-restore.json,build/perf/metrics-gc.json

  # 恢复强杀注入（验收规格 §2.1/§2.4；票 #41）：acceptance:recovery 注入
  # harness——每轮全新 fixture + 全新数据目录起 pgheadless -apply 子进程，按
  # 种子调度的目标相位（staging/applying/verifying 五轮全覆盖）标记出现后随机
  # 延迟 taskkill /F 真强杀 → 重启走恢复管线（bootstrap.Build 启动恢复）→
  # 四不变式逐轮断言（终局口径/diff 归零/apply 门禁与复跑/重复恢复幂等，任一
  # 违反非零退出）；recovery_required 轮以 AcknowledgeRecovery 收口（§2.4 授权
  # 的唯一 L0 人工路径自动化）后复跑 -apply。逐轮记录 JSON 落
  # docs/acceptance/records/p2-recovery-<date>-<host>.json。
  acceptance:recovery:
    summary: Force-kills pgheadless -apply subprocesses at seeded random moments across 5 rounds, restarts the recovery pipeline, asserts the four recovery invariants per round (acceptance L0)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - go build -o bin/pgrecovery.exe ./cmd/pgrecovery
      - rm -rf build/recovery
      - bin/pgrecovery.exe

  # GC 验收链（验收规格 §6 五件套之 2/3；票 #64/#66；孤儿快照扩展票 #89）：
  # 全新 fixture + 全新数据目录 → ①`-commits 25` 连续小 apply 造 >20 提交历史
  # → ②`-gc` CLI 通道触发（keep_commits 默认 20：裁 5）断言墓碑
  # pruned_before_count>0 且被裁行消失、存活 ≥K=3、引用图不变式逐 digest 对账
  # 零违例、最老存活提交可达闭包逐字节复验（回滚承诺不缩水；restore 服务面归
  # 票 #60）+ **孤儿快照扩展（ADR-0011 §4）**：两轮纯扫描落「从未进提交的中间
  # 扫描快照」夹具 → 被裁提交的验证快照自然转孤儿一并删、中间扫描快照除最新外
  # 同删、resource_representations 随行级联删、引用图不变式对账扩展至快照账面
  # （清扫后孤儿残留必须为零）→ ③`-keep-commits 5` 后 `-gc -probes`：head 前移
  # + 活跃 draft 计划屏障 + staged/recovery_required 两个未收口 run 注入
  # （正例②③）→ 安全窗口关闭断言（pending+排队文案）→ 夹具收口 → 开窗自动
  # 续排（同一任务跑完）→ 屏障截断存活>N、观察 digest 续跑后被回收、引用图
  # 对账零违例。三段 -gc 各记 GC 计时（p3-perf-run/1 的 gc 段）并归档 p3-gc
  # 记录（同日多轮 -tNN 后缀）。任一断言失败非零退出。
  acceptance:gc:
    summary: Builds a >20-commit history via repeated small applies, runs pgheadless gc (CLI channel) with per-run GC timing records, asserts tombstone/K=3 floor/reference-graph invariant/oldest-commit restorability, the three protection red lines, and the orphan-snapshot sweep extension (commit-pruned verified snapshots + never-committed intermediate scan snapshots + snapshot-account invariant, acceptance L0)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - rm -rf build/gc
      - go run ./cmd/pgfixture -out build/gc/fixture -mods 6 -text-files 12
      - bin/pgheadless.exe -project build/gc/fixture/project -instance build/gc/fixture/instance -data build/gc/data -commits 25
      - bin/pgheadless.exe -project build/gc/fixture/project -instance build/gc/fixture/instance -data build/gc/data -gc -metrics build/gc/metrics-t01.json
      - bin/pgheadless.exe -project build/gc/fixture/project -instance build/gc/fixture/instance -data build/gc/data -keep-commits 5 -gc -metrics build/gc/metrics-t02.json
      - PGHEADLESS_GC_PROBES=1 bin/pgheadless.exe -project build/gc/fixture/project -instance build/gc/fixture/instance -data build/gc/data -gc -metrics build/gc/metrics-t03.json
      - cp build/gc/metrics-t01.json docs/acceptance/records/p3-gc-$(date +%F)-$(hostname)-t01.json
      - cp build/gc/metrics-t02.json docs/acceptance/records/p3-gc-$(date +%F)-$(hostname)-t02.json
      - cp build/gc/metrics-t03.json docs/acceptance/records/p3-gc-$(date +%F)-$(hostname)-t03.json

  # L1 walkthrough 数据准备（验收规格 §10.9；票 #66，B 口径人工清单的供数面）：
  # ①restore 历史（exact + partial 各一）与补全对话框数据（-restore 四场景链的
  # 数据目录；场景③含 user_object_required 草稿与 staged 补全）；②授权模式开态
  # （-set-authorized 1）；③>20 提交可触发 gc 的长历史；restore
  # recovery_required 工作区复用 acceptance:recovery:restore 的真实强杀产物
  #（build/recovery-restore/round-N/attempt-K）。
  l1:data:
    summary: Prepares the L1 walkthrough data set — restore history (exact+partial), user-object dialog data, authorized-mode-on state, >20-commit gc history (B 口径供数)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - go build -o bin/pgfixture.exe ./cmd/pgfixture
      - rm -rf build/l1
      - go run ./cmd/pgfixture -out build/l1/fixture -mods 6 -text-files 12 -plain-mods 2
      - bin/pgheadless.exe -project build/l1/fixture/project -instance build/l1/fixture/instance -data build/l1/data -restore
      - bin/pgheadless.exe -project build/l1/fixture/project -instance build/l1/fixture/instance -data build/l1/data -set-authorized 1
      - go run ./cmd/pgfixture -out build/l1/gc-fixture -mods 6 -text-files 12
      - bin/pgheadless.exe -project build/l1/gc-fixture/project -instance build/l1/gc-fixture/instance -data build/l1/gc-data -commits 25
      - echo "== L1 数据清单 =="
      - echo "① restore 历史（exact/partial 各一）+ 补全对话框数据 → build/l1/fixture + build/l1/data"
      - echo "② 授权模式开态 → build/l1/data（authorized_apply=1）"
      - echo "③ >20 提交长历史 → build/l1/gc-fixture + build/l1/gc-data"
      - echo "④ restore recovery_required 工作区（真实强杀产物）→ build/recovery-restore/round-N/attempt-K（先跑 acceptance:recovery:restore）"

  # 下载失败注入链（验收规格 §5.1；票 #66）：假 CDN 进程（pgfixture -serve，
  # pgheadless 自动拉起）+ 五场景断言链（零真网）——①成功链（initialize/升版
  # 回滚 restore redownload，两层校验：声明 sha1 引擎校验 + staging sha256
  # 复核）②探测降标（404 → user_object_required + cf_unavailable）③failed
  # 终局可重入（429×5 → failed 不进 recovery → 假 CDN 恢复 → 同 plan 重
  # Confirm committed）④sync 剔除语义（双行挂其一 → partial + 跳过清单；全败
  # → failed 零提交）⑤续传（半截断流 → .part Range 续传，假 CDN 请求记录含
  # Range 头证据）。逐场景记录 JSON 落
  # docs/acceptance/records/p3-download-<date>-<host>.json。任一断言失败非零退出。
  acceptance:download:
    summary: Runs the pgheadless -download chain against a managed fake-CDN process with five scripted-failure scenarios (acceptance L0)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - go build -o bin/pgfixture.exe ./cmd/pgfixture
      - rm -rf build/download
      - bin/pgheadless.exe -project build/download/fixture/project -instance build/download/fixture/instance -data build/download/data -download

  # restore 运行强杀注入（验收规格 §4；票 #66）：acceptance:recovery:restore
  # 注入 harness——每轮全新轮目录起 pgheadless -restore-target 子进程（自建
  # 夹具历史 → PrepareRestore → == ConfirmRestorePlan == armed 行 → restore
  # 运行；假 CDN 由 harness 拉起 pgfixture -serve 供给 redownload 相位），armed
  # 后按种子调度目标相位（staging 下载/applying/verifying 五轮全覆盖）标记出现
  # 后随机延迟 taskkill /F 真强杀 → 重启走恢复管线 → P2 四不变式照断 + restore
  # 特有两条（R5 绝不假 committed：committed run 的 staging 无 .part 残留 + 收口
  # 后 diff 归零；R6 kind=restore 终局后历史不改写：armed 链原位 + 新头
  # kind=restore）逐轮断言；recovery_required 轮以 AcknowledgeRecovery 收口后
  # 复跑 -restore-target 至 committed。逐轮记录 JSON 落
  # docs/acceptance/records/p3-recovery-restore-<date>-<host>.json。任一违规
  # 非零退出。P2 acceptance:recovery（apply×5）原样保留作回归。
  acceptance:recovery:restore:
    summary: Force-kills pgheadless -restore-target subprocesses at seeded random moments across 5 rounds covering staging-download/applying/verifying, restarts the recovery pipeline, asserts the four invariants plus the two restore-specific ones (acceptance L0)
    cmds:
      - go build -o bin/pgheadless.exe ./cmd/pgheadless
      - go build -o bin/pgfixture.exe ./cmd/pgfixture
      - go build -o bin/pgrecovery.exe ./cmd/pgrecovery
      - rm -rf build/recovery-restore
      - bin/pgrecovery.exe -mode restore

  # B 口径前端构建门槛（验收规格 §1.1）：vue-tsc 类型检查 + Vite 生产构建
  #（package.json `build` = `vue-tsc && vite build --mode production`）。
  frontend:build:
    summary: Type-checks (vue-tsc) and produces the production frontend build (acceptance L0, B 口径)
    dir: frontend
    cmds:
      - yarn build
